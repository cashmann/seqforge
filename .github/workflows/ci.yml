name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --all --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: CLI smoke test
        run: |
          bin=target/release/seqforge
          mkdir -p smoke
          "$bin" asm tests/fixtures/demo.mus -o smoke/demo.zseq
          "$bin" disasm smoke/demo.zseq -o smoke/demo.mus
          "$bin" asm smoke/demo.mus -o smoke/demo2.zseq
          "$bin" roundtrip smoke --verbose
      - name: Build Intel macOS binary
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: seqforge-${{ runner.os }}
          path: |
            target/release/seqforge
            target/release/seqforge.exe
            target/x86_64-apple-darwin/release/seqforge
          if-no-files-found: ignore
